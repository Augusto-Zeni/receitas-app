name: CI

on:
  push:
    branches-ignore: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
    inputs:
      push-images:
        description: "Fazer push das imagens para o registry"
        type: boolean
        default: false
    outputs:
      backend-image:
        description: "Imagem Docker do backend"
        value: ${{ jobs.build.outputs.backend-image }}
      frontend-hml-image:
        description: "Imagem Docker do frontend (HML)"
        value: ${{ jobs.build.outputs.frontend-hml-image }}
      frontend-prd-image:
        description: "Imagem Docker do frontend (PRD)"
        value: ${{ jobs.build.outputs.frontend-prd-image }}

jobs:
  test:
    name: Testes automatizados (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm ci

      - name: Executar testes com cobertura
        id: tests
        working-directory: backend
        run: |
          echo "::group::Resultado dos testes"
          npm test -- --ci --verbose --coverage --coverageReporters=text 2>&1 | tee /tmp/test-output.txt
          echo "::endgroup::"

      - name: Publicar resumo dos testes
        if: always()
        run: |
          echo "## Resultado dos Testes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Autor** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/test-output.txt ]; then
            echo "### Saída dos testes" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(PASS|FAIL|Tests:|Test Suites:|Coverage)" /tmp/test-output.txt | head -30 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  lint:
    name: Análise de qualidade de código (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: |
          echo "::group::ESLint — Backend"
          npm run lint
          echo "::endgroup::"

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: |
          echo "::group::ESLint — Frontend"
          npm run lint
          echo "::endgroup::"

      - name: Publicar resumo do lint
        if: always()
        run: |
          echo "## 🔍 Análise de Qualidade (ESLint)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Módulo | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend** | Sem erros |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend** | Sem erros |" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build e Push Docker Images
    runs-on: ubuntu-latest
    needs: [test, lint]
    permissions:
      contents: read
      packages: write
    outputs:
      backend-image: ${{ steps.tags.outputs.backend }}
      frontend-hml-image: ${{ steps.tags.outputs.frontend-hml }}
      frontend-prd-image: ${{ steps.tags.outputs.frontend-prd }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Definir tags das imagens
        id: tags
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${REPO}/backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend-hml=ghcr.io/${REPO}/frontend:hml-${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend-prd=ghcr.io/${REPO}/frontend:prd-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Login no GitHub Container Registry
        if: inputs.push-images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ inputs.push-images || false }}
          tags: ${{ steps.tags.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build e push frontend HML
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ inputs.push-images || false }}
          tags: ${{ steps.tags.outputs.frontend-hml }}
          build-args: |
            VITE_API_URL=/api
            VITE_APP_ENV=hml
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build e push frontend PRD
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ inputs.push-images || false }}
          tags: ${{ steps.tags.outputs.frontend-prd }}
          build-args: |
            VITE_API_URL=/api
            VITE_APP_ENV=prd
          cache-from: type=gha,scope=frontend

      - name: Publicar resumo do build
        if: always()
        run: |
          echo "## 🐳 Imagens Docker Geradas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Imagem | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend** | \`${{ steps.tags.outputs.backend }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend HML** | \`${{ steps.tags.outputs.frontend-hml }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend PRD** | \`${{ steps.tags.outputs.frontend-prd }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Commit:** \`${{ github.sha }}\`  |  **Branch:** \`${{ github.ref_name }}\`  |  **Autor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
