name: CI

on:
  push:
    branches-ignore: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

jobs:
  test:
    name: Testes automatizados (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm ci

      - name: Executar testes
        working-directory: backend
        run: npm test -- --ci --verbose --coverage --coverageReporters=text

  lint:
    name: Análise de qualidade de código (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar e compilar backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Instalar e compilar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
