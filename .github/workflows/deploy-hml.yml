name: Deploy HML

on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      push-images: true
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy para Homologação (porta 9000)
    runs-on: self-hosted
    needs: ci
    environment: homologacao
    steps:
      - name: Login no GitHub Container Registry
        run: |
          AUTH=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 -w 0)
          sudo mkdir -p /root/.docker
          echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"${AUTH}\"}}}" | sudo tee /root/.docker/config.json > /dev/null

      - name: Atualizar código e pull das imagens
        working-directory: /home/univates/receitas-app
        run: |
          set -e
          echo "::group::Git — sincronizando branch develop"
          git fetch origin develop
          git reset --hard origin/develop
          echo "::endgroup::"

          echo "::group::Docker — pull das imagens"
          export BACKEND_IMAGE="${{ needs.ci.outputs.backend-image }}"
          export FRONTEND_IMAGE="${{ needs.ci.outputs.frontend-hml-image }}"
          export HML_JWT_SECRET="${{ secrets.HML_JWT_SECRET }}"
          sudo -E docker compose -p receitas-hml -f docker-compose.hml.yml pull
          echo "::endgroup::"

      - name: Subir containers
        working-directory: /home/univates/receitas-app
        run: |
          set -e
          export BACKEND_IMAGE="${{ needs.ci.outputs.backend-image }}"
          export FRONTEND_IMAGE="${{ needs.ci.outputs.frontend-hml-image }}"
          export HML_JWT_SECRET="${{ secrets.HML_JWT_SECRET }}"

          echo "::group::Resolver conflitos de containers"
          for container in hml-db hml-backend hml-frontend; do
            if sudo docker inspect "$container" &>/dev/null; then
              project=$(sudo docker inspect "$container" --format '{{index .Config.Labels "com.docker.compose.project"}}' 2>/dev/null || echo "")
              if [ "$project" != "receitas-hml" ]; then
                echo "Removendo container conflitante: $container (projeto: ${project:-none})"
                sudo docker stop "$container" 2>/dev/null || true
                sudo docker rm "$container" 2>/dev/null || true
              fi
            fi
          done
          echo "::endgroup::"

          echo "::group::Docker Compose — subindo serviços"
          sudo -E docker compose -p receitas-hml -f docker-compose.hml.yml up -d --remove-orphans
          echo "::endgroup::"

          echo "::group::Status dos containers"
          sudo docker compose -p receitas-hml -f docker-compose.hml.yml ps
          echo "::endgroup::"

          echo "::notice title=Deploy HML concluído::Ambiente de homologação atualizado na porta 9000"

      - name: Limpar imagens antigas
        run: sudo docker image prune -f

      - name: Publicar resumo do deploy
        if: always()
        run: |
          echo "## Deploy — Homologação" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Ambiente** | Homologação |" >> $GITHUB_STEP_SUMMARY
          echo "| **Porta** | \`9000\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Autor** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Horário** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Imagens implantadas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Serviço | Imagem |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend** | \`${{ needs.ci.outputs.backend-image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend** | \`${{ needs.ci.outputs.frontend-hml-image }}\` |" >> $GITHUB_STEP_SUMMARY
