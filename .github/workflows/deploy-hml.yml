name: Deploy HML

on:
  push:
    branches: [develop]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy para Homologação (porta 9000)
    runs-on: ubuntu-latest
    needs: ci
    environment: homologacao
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_SSH_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          envs: HML_JWT_SECRET
          script: |
            set -e
            cd /home/${{ secrets.VM_SSH_USER }}/receitas-app
            git pull origin develop
            docker compose -f docker-compose.hml.yml up --build -d
            echo "✅ HML atualizado com sucesso"
            docker compose -f docker-compose.hml.yml ps
        env:
          HML_JWT_SECRET: ${{ secrets.HML_JWT_SECRET }}
