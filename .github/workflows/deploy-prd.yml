name: Deploy PRD

on:
  push:
    branches: [main]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy para Produção (porta 9001)
    runs-on: self-hosted
    needs: ci
    environment: producao
    steps:
      - name: Deploy PRD
        working-directory: /home/univates/receitas-app
        run: |
          set -e
          git fetch origin main
          git reset --hard origin/main
          docker compose -f docker-compose.prd.yml up --build -d
          echo "PRD atualizado com sucesso"
          docker compose -f docker-compose.prd.yml ps
        env:
          PRD_JWT_SECRET: ${{ secrets.PRD_JWT_SECRET }}
