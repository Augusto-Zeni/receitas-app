services:
  db:
    image: postgres:16-alpine
    container_name: prd-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: receitas_prd
    volumes:
      - prd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - prd-network

  backend:
    image: ${BACKEND_IMAGE}
    container_name: prd-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/receitas_prd
      PORT: 3000
      JWT_SECRET: ${PRD_JWT_SECRET:-prd-jwt-secret-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prd-network

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: prd-frontend
    restart: unless-stopped
    ports:
      - "9001:80"
    depends_on:
      - backend
    networks:
      - prd-network

networks:
  prd-network:
    driver: bridge

volumes:
  prd_postgres_data:
